syntax = "proto3";

package user.v1;

option go_package = "github.com/oririfai/revoluchat-go-sdk/proto/user_v1";

service UserService {
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
}

message GetUserRequest {
  string id = 1;
}

message GetUserResponse {
  string id = 1;
  string uuid = 2;
  string name = 3;
  string phone = 4;
  string status = 5;
  bool is_kyc = 6;
  string avatar_url = 7;
}
